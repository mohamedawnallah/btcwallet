name: Performance Benchmarks

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  GOCACHE: /home/runner/work/go/pkg/build
  GOPATH: /home/runner/work/go
  GOBIN: /home/runner/work/go/bin
  GO111MODULE: on
  GO_VERSION: 1.24.6
  BENCHMARK_COUNT: 6
  BENCHMARK_TIMEOUT_MINUTES: 30
  BENCHMARK_BASE_REF: CI-benchmarks-xxxx3
  # Fail CI if performance degrades by this percentage or more. It reduces false
  # positives from CI noise.
  PERFORMANCE_REGRESSION_THRESHOLD: 30
  # Highlight improvements that meet or exceed this percentage.
  PERFORMANCE_IMPROVEMENT_THRESHOLD: 30

jobs:
  benchmark-base:
    name: Benchmark Base Branch (${{ github.base_ref }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install GNU Parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel

      - name: Run benchmarks on base branch (${{ github.base_ref }})
        timeout-minutes: ${{ fromJSON(env.BENCHMARK_TIMEOUT_MINUTES) }}
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="${{ env.BENCHMARK_BASE_REF }}"
          fi

          echo "Running benchmarks on base branch: $BASE_REF"
          git fetch origin $BASE_REF
          git checkout origin/$BASE_REF

          # Get list of packages with benchmarks.
          go list ./... | xargs -I{} sh -c 'go test -list="Benchmark.*" {} 2>/dev/null | grep -q "^Benchmark" && echo {}' | \
            parallel -j ${{ env.BENCHMARK_COUNT }} --line-buffer \
            "go test -count=${{ env.BENCHMARK_COUNT }} -timeout=0 -benchmem -bench=. -run=^$ {} 2>&1" | \
            tee base-bench-raw.txt

          grep '^Benchmark' base-bench-raw.txt | sort > base-bench.txt

      - name: Upload base benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: base-bench
          path: base-bench.txt
          retention-days: 7

  benchmark-pr:
    name: Benchmark PR Branch (${{ github.head_ref }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install GNU Parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel

      - name: Run benchmarks on PR branch (${{ github.head_ref }})
        timeout-minutes: ${{ fromJSON(env.BENCHMARK_TIMEOUT_MINUTES) }}
        run: |
          HEAD_REF="${{ github.head_ref }}"
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF=$(git rev-parse --abbrev-ref HEAD)
          fi

          echo "Running benchmarks on PR branch: $HEAD_REF"
          git fetch origin $HEAD_REF
          git checkout origin/$HEAD_REF

          # Get list of packages with benchmarks.
          go list ./... | xargs -I{} sh -c 'go test -list="Benchmark.*" {} 2>/dev/null | grep -q "^Benchmark" && echo {}' | \
            parallel -j ${{ env.BENCHMARK_PARALLEL_JOBS }} --line-buffer \
            "go test -count=${{ env.BENCHMARK_COUNT }} -timeout=0 -benchmem -bench=. -run=^$ {} 2>&1" | \
            tee pr-bench-raw.txt

          grep '^Benchmark' pr-bench-raw.txt | sort > pr-bench.txt

      - name: Upload PR benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: pr-bench
          path: pr-bench.txt
          retention-days: 7

  compare:
    name: Compare and Report
    runs-on: ubuntu-latest
    needs: [benchmark-base, benchmark-pr]
    if: always()

    steps:
      - name: git checkout
        uses: actions/checkout@v5

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download base benchmark results
        uses: actions/download-artifact@v4
        with:
          name: base-bench

      - name: Download PR benchmark results
        uses: actions/download-artifact@v4
        with:
          name: pr-bench

      - name: Compare benchmarks and check for performance regressions
        id: compare
        continue-on-error: true
        run: |
          chmod +x scripts/compare-benchmarks.sh
          scripts/compare-benchmarks.sh base-bench.txt pr-bench.txt summary.txt ${{ env.PERFORMANCE_REGRESSION_THRESHOLD }} ${{ env.PERFORMANCE_IMPROVEMENT_THRESHOLD }}

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const postComment = require('./scripts/post-benchmark-comment.js');
            await postComment(github, context);

      - name: Upload comparison results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            summary.txt
            base-bench.txt
            pr-bench.txt
          retention-days: 7

      - name: Fail workflow if regressions found
        if: steps.compare.outcome == 'failure'
        run: |
          echo "⚠️ Performance regressions detected!"
          exit 1
