name: Benchmark Comparison

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GOCACHE: /home/runner/work/go/pkg/build
  GOPATH: /home/runner/work/go
  GOBIN: /home/runner/work/go/bin
  GO111MODULE: on
  GO_VERSION: 1.24.6

jobs:
  benchmark-base:
    name: Benchmark Target Branch (${{ github.base_ref }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install GNU Parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel

      - name: Run benchmarks on target branch (${{ github.base_ref }})
        timeout-minutes: 30
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}

          # Run single benchmark for quick evaluation
          go test -tags='dev error' -timeout=0 -benchmem -bench='^BenchmarkBroadcastAPI' -run=NONE ./wallet \
            2>&1 | tee base-bench-raw.txt

          # Extract and sort benchmark results
          grep '^Benchmark' base-bench-raw.txt | sort > base-bench.txt

          echo "Target branch (${{ github.base_ref }}) benchmarks completed"

      - name: Upload base benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: base-bench
          path: base-bench.txt
          retention-days: 30

  benchmark-pr:
    name: Benchmark PR \#${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install GNU Parallel
        run: |
          sudo apt-get update
          sudo apt-get install -y parallel

      - name: Run benchmarks on PR ${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})
        timeout-minutes: 30
        run: |
          git fetch origin ${{ github.head_ref }}
          git checkout origin/${{ github.head_ref }}

          # Run single benchmark for quick evaluation
          go test -tags='dev error' -timeout=0 -benchmem -bench='^BenchmarkBroadcastAPI' -run=NONE ./wallet \
            2>&1 | tee pr-bench-raw.txt

          # Extract and sort benchmark results
          grep '^Benchmark' pr-bench-raw.txt | sort > pr-bench.txt

          echo "PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }}) branch benchmarks completed"

      - name: Upload PR benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: pr-bench
          path: pr-bench.txt
          retention-days: 30

  compare:
    name: Compare Benchmarks
    runs-on: ubuntu-latest
    needs: [benchmark-base, benchmark-pr]

    steps:
      - name: git checkout
        uses: actions/checkout@v5

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Download base benchmark results
        uses: actions/download-artifact@v4
        with:
          name: base-bench

      - name: Download PR benchmark results
        uses: actions/download-artifact@v4
        with:
          name: pr-bench

      - name: Compare benchmarks with benchstat
        id: benchstat
        run: |
          echo "## 📊 Benchmark Comparison Results" > benchstat-output.txt
          echo "" >> benchstat-output.txt
          echo "**Comparing:** \`${{ github.base_ref }}\` (base) → \`${{ github.head_ref }}\` (PR)" >> benchstat-output.txt
          echo "" >> benchstat-output.txt

          # Run benchstat and save raw output
          benchstat base-bench.txt pr-bench.txt | tee benchstat-raw.txt > benchstat-table.txt || true

          # Create formatted summary
          echo "### 📈 Performance Summary" >> benchstat-output.txt
          echo "" >> benchstat-output.txt

          # Extract geomean if present
          if grep -q "geomean" benchstat-table.txt; then
            echo "**Overall Performance (geomean):**" >> benchstat-output.txt
            grep "geomean" benchstat-table.txt | while read -r line; do
              echo "- $line" >> benchstat-output.txt
            done
            echo "" >> benchstat-output.txt
          fi

          # Count improvements and regressions
          IMPROVEMENTS=$(grep -c '\-[0-9]\+\.[0-9]\+%' benchstat-table.txt || echo "0")
          REGRESSIONS=$(grep -c '\+[0-9]\+\.[0-9]\+%' benchstat-table.txt || echo "0")
          NO_CHANGE=$(grep -c '~' benchstat-table.txt || echo "0")

          echo "**Changes:**" >> benchstat-output.txt
          echo "- ✅ **$IMPROVEMENTS** benchmarks improved (faster/less memory)" >> benchstat-output.txt
          echo "- ⚠️ **$REGRESSIONS** benchmarks regressed (slower/more memory)" >> benchstat-output.txt
          echo "- ➖ **$NO_CHANGE** benchmarks unchanged" >> benchstat-output.txt
          echo "" >> benchstat-output.txt

          # Add legend
          echo "### 📖 How to Read Results" >> benchstat-output.txt
          echo "" >> benchstat-output.txt
          echo "**Symbols:**" >> benchstat-output.txt
          echo "- \`~\` = no significant difference" >> benchstat-output.txt
          echo "- \`+X%\` = regression (slower/more memory)" >> benchstat-output.txt
          echo "- \`-X%\` = improvement (faster/less memory)" >> benchstat-output.txt
          echo "- \`±∞\` = high variance (need more samples for reliable comparison)" >> benchstat-output.txt
          echo "" >> benchstat-output.txt
          echo "**Metrics:**" >> benchstat-output.txt
          echo "- \`ns/op\` = nanoseconds per operation (time)" >> benchstat-output.txt
          echo "- \`B/op\` = bytes allocated per operation (memory)" >> benchstat-output.txt
          echo "- \`allocs/op\` = number of allocations per operation" >> benchstat-output.txt
          echo "" >> benchstat-output.txt

          # Add detailed results
          echo "### 📋 Detailed Results" >> benchstat-output.txt
          echo "" >> benchstat-output.txt
          echo "<details>" >> benchstat-output.txt
          echo "<summary>Click to expand full benchmark comparison</summary>" >> benchstat-output.txt
          echo "" >> benchstat-output.txt
          echo '```' >> benchstat-output.txt
          cat benchstat-table.txt >> benchstat-output.txt
          echo '```' >> benchstat-output.txt
          echo "" >> benchstat-output.txt
          echo "</details>" >> benchstat-output.txt

          # Save for PR comment
          cat benchstat-output.txt > $GITHUB_STEP_SUMMARY

      - name: Check for performance regressions
        run: |
          # Performance regression thresholds
          MAX_TIME_REGRESSION=10       # Maximum allowed time regression percentage
          MAX_ALLOC_BYTES_REGRESSION=10 # Maximum allowed bytes/op regression percentage
          MAX_ALLOC_COUNT_REGRESSION=10 # Maximum allowed allocs/op regression percentage

          echo "Checking for performance regressions..."
          echo "Thresholds: ${MAX_TIME_REGRESSION}% for time, ${MAX_ALLOC_BYTES_REGRESSION}% for bytes, ${MAX_ALLOC_COUNT_REGRESSION}% for alloc count"

          # Parse benchstat output for regressions
          # Format: "name  old time/op  new time/op  delta"
          # A "+" delta means regression (slower), "-" means improvement (faster)

          REGRESSIONS_FOUND=false

          # Check time regressions (lines with "ns/op" and positive delta > threshold)
          while IFS= read -r line; do
            # Skip header and non-benchmark lines
            if [[ $line =~ ^name ]] || [[ ! $line =~ ns/op ]]; then
              continue
            fi

            # Extract delta percentage (e.g., "+12.5%" -> "12.5")
            if [[ $line =~ \+([0-9]+\.[0-9]+)% ]]; then
              delta="${BASH_REMATCH[1]}"
              benchmark_name=$(echo "$line" | awk '{print $1}')

              # Compare with threshold (use bc for floating point)
              if (( $(echo "$delta > $MAX_TIME_REGRESSION" | bc -l) )); then
                echo "❌ TIME REGRESSION: $benchmark_name regressed by ${delta}% (threshold: ${MAX_TIME_REGRESSION}%)"
                REGRESSIONS_FOUND=true
              fi
            fi
          done < benchstat-raw.txt

          # Check memory bytes allocation regressions (lines with "B/op" and positive delta > threshold)
          while IFS= read -r line; do
            # Skip header and non-benchmark lines
            if [[ $line =~ ^name ]] || [[ ! $line =~ B/op ]]; then
              continue
            fi

            # Extract delta percentage
            if [[ $line =~ \+([0-9]+\.[0-9]+)% ]]; then
              delta="${BASH_REMATCH[1]}"
              benchmark_name=$(echo "$line" | awk '{print $1}')

              # Compare with threshold
              if (( $(echo "$delta > $MAX_ALLOC_BYTES_REGRESSION" | bc -l) )); then
                echo "❌ MEMORY BYTES REGRESSION: $benchmark_name memory usage increased by ${delta}% (threshold: ${MAX_ALLOC_BYTES_REGRESSION}%)"
                REGRESSIONS_FOUND=true
              fi
            fi
          done < benchstat-raw.txt

          # Check allocation count regressions (lines with "allocs/op" and positive delta > threshold)
          while IFS= read -r line; do
            # Skip header and non-benchmark lines
            if [[ $line =~ ^name ]] || [[ ! $line =~ allocs/op ]]; then
              continue
            fi

            # Extract delta percentage
            if [[ $line =~ \+([0-9]+\.[0-9]+)% ]]; then
              delta="${BASH_REMATCH[1]}"
              benchmark_name=$(echo "$line" | awk '{print $1}')

              # Compare with threshold
              if (( $(echo "$delta > $MAX_ALLOC_COUNT_REGRESSION" | bc -l) )); then
                echo "❌ ALLOCATION COUNT REGRESSION: $benchmark_name allocation count increased by ${delta}% (threshold: ${MAX_ALLOC_COUNT_REGRESSION}%)"
                REGRESSIONS_FOUND=true
              fi
            fi
          done < benchstat-raw.txt

          if [ "$REGRESSIONS_FOUND" = true ]; then
            echo ""
            echo "⚠️  Performance regressions detected above threshold!"
            echo "Review the benchmark results and consider optimizing before merging."
            exit 1
          else
            echo "✅ No significant performance regressions detected."
          fi

      - name: Comment PR with benchmark results
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const benchstatOutput = fs.readFileSync('benchstat-output.txt', 'utf8');

            // Find existing benchmark comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Benchmark Comparison Results')
            );

            const commentBody = benchstatOutput + '\n\n---\n\n' +
              '💡 **Notes:**\n' +
              '- Benchmarks run in parallel on separate GitHub runners\n' +
              '- Statistical significance requires 6+ samples; `±∞` indicates high variance\n' +
              '- Performance regression threshold: **10%** for time, memory, and allocations\n' +
              '\n' +
              '_Generated by [benchmark.yml](.github/workflows/benchmark.yml) using [benchstat](https://pkg.go.dev/golang.org/x/perf/cmd/benchstat)_';

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }

      - name: Upload benchmark comparison results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-comparison
          path: |
            benchstat-output.txt
            benchstat-raw.txt
          retention-days: 30
