name: Benchmark Comparison

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  GOCACHE: /home/runner/work/go/pkg/build
  GOPATH: /home/runner/work/go
  GOBIN: /home/runner/work/go/bin
  GO111MODULE: on
  GO_VERSION: 1.24.6

jobs:
  benchmark:
    name: Run Benchmarks and Compare
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks on base branch
        run: |
          BASE_REF="${{ github.base_ref }}"
          # Default to interface-wallet for local testing (where benchmarks exist)
          if [ -z "$BASE_REF" ]; then
            BASE_REF="interface-wallet"
          fi

          git fetch origin $BASE_REF
          git checkout origin/$BASE_REF

          go test -tags='dev error' -timeout=0 -benchmem -bench='^BenchmarkBroadcastAPI' -run=NONE ./wallet \
            2>&1 | tee base-bench-raw.txt

          grep '^Benchmark' base-bench-raw.txt | sort > base-bench.txt

      - name: Run benchmarks on PR branch
        run: |
          HEAD_REF="${{ github.head_ref }}"
          # Default to current branch for local testing
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF=$(git rev-parse --abbrev-ref HEAD)
          fi

          git fetch origin $HEAD_REF
          git checkout origin/$HEAD_REF

          go test -tags='dev error' -timeout=0 -benchmem -bench='^BenchmarkBroadcastAPI' -run=NONE ./wallet \
            2>&1 | tee pr-bench-raw.txt

          grep '^Benchmark' pr-bench-raw.txt | sort > pr-bench.txt

      - name: Compare and analyze results
        run: |
          # Run benchstat
          benchstat base-bench.txt pr-bench.txt > benchstat-output.txt

          # Performance regression threshold
          THRESHOLD=10

          echo "## 📊 Benchmark Results" > summary.txt
          echo "" >> summary.txt

          # Show benchstat results
          echo "### Detailed Comparison" >> summary.txt
          echo '```' >> summary.txt
          cat benchstat-output.txt >> summary.txt
          echo '```' >> summary.txt
          echo "" >> summary.txt

          # Check for regressions beyond threshold
          echo "### 🔴 Regressions Beyond ${THRESHOLD}% Threshold" >> summary.txt
          echo "" >> summary.txt

          REGRESSIONS_FOUND=false

          while IFS= read -r line; do
            if [[ $line =~ \+([0-9]+\.[0-9]+)% ]]; then
              delta="${BASH_REMATCH[1]}"
              if (( $(echo "$delta > $THRESHOLD" | bc -l) )); then
                echo "- $line" >> summary.txt
                REGRESSIONS_FOUND=true
              fi
            fi
          done < benchstat-output.txt

          if [ "$REGRESSIONS_FOUND" = false ]; then
            echo "✅ None" >> summary.txt
          fi
          echo "" >> summary.txt

          # Show significant improvements
          echo "### ✅ Significant Improvements" >> summary.txt
          echo "" >> summary.txt

          IMPROVEMENTS_FOUND=false

          while IFS= read -r line; do
            if [[ $line =~ \-([0-9]+\.[0-9]+)% ]]; then
              delta="${BASH_REMATCH[1]}"
              if (( $(echo "$delta > $THRESHOLD" | bc -l) )); then
                echo "- $line" >> summary.txt
                IMPROVEMENTS_FOUND=true
              fi
            fi
          done < benchstat-output.txt

          if [ "$IMPROVEMENTS_FOUND" = false ]; then
            echo "None significant (>${THRESHOLD}%)" >> summary.txt
          fi

          # Show summary
          cat summary.txt

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('summary.txt', 'utf8');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('📊 Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: summary
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: summary
              });
            }

      - name: Copy results for local testing
        if: env.ACT == 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.act-results
          cp -v summary.txt benchstat-output.txt base-bench.txt pr-bench.txt $GITHUB_WORKSPACE/.act-results/
          echo "Results copied to .act-results/"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            summary.txt
            benchstat-output.txt
            base-bench.txt
            pr-bench.txt
          retention-days: 30
