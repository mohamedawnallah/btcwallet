name: Benchmark Comparison

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  # Read permissions to be able checkout code.
  contents: read

  # Write permissions to be able to comment on PRs.
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  GOCACHE: /home/runner/work/go/pkg/build
  GOPATH: /home/runner/work/go
  GOBIN: /home/runner/work/go/bin
  GO111MODULE: on
  GO_VERSION: 1.24.6

jobs:
  benchmark:
    name: Run Benchmarks and Compare
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks on base branch
        run: |
          BASE_REF="${{ github.base_ref }}"
          # Default to interface-wallet for local testing (where benchmarks exist)
          if [ -z "$BASE_REF" ]; then
            BASE_REF="interface-wallet"
          fi

          git fetch origin $BASE_REF
          git checkout origin/$BASE_REF

          go test -count=6 -tags='dev error' -timeout=0 -benchmem -bench='^BenchmarkBroadcastAPI' -run=NONE ./wallet \
            2>&1 | tee base-bench-raw.txt

          grep '^Benchmark' base-bench-raw.txt | sort > base-bench.txt

      - name: Run benchmarks on PR branch
        run: |
          HEAD_REF="${{ github.head_ref }}"
          # Default to current branch for local testing
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF=$(git rev-parse --abbrev-ref HEAD)
          fi

          git fetch origin $HEAD_REF
          git checkout origin/$HEAD_REF

          go test -count=6 -tags='dev error' -timeout=0 -benchmem -bench='^BenchmarkBroadcastAPI' -run=NONE ./wallet \
            2>&1 | tee pr-bench-raw.txt

          grep '^Benchmark' pr-bench-raw.txt | sort > pr-bench.txt

      - name: Compare and analyze results
        run: |
          chmod +x scripts/analyze-benchmarks.sh
          # analyze-benchmarks.sh <base> <pr> <output> <regression_threshold> <improvement_threshold>
          scripts/analyze-benchmarks.sh base-bench.txt pr-bench.txt summary.txt 10 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const postComment = require('./scripts/post-benchmark-comment.js');
            await postComment(github, context);

      - name: Copy results for local testing
        if: env.ACT == 'true'
        run: |
          mkdir -p $GITHUB_WORKSPACE/.act-results
          cp -v summary.txt benchstat-output.txt base-bench.txt pr-bench.txt $GITHUB_WORKSPACE/.act-results/
          echo "Results copied to .act-results/"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            summary.txt
            benchstat-output.txt
            base-bench.txt
            pr-bench.txt
          retention-days: 30
