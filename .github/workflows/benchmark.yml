name: Performance Benchmarks

on:
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  # Read permissions to be able checkout code.
  contents: read

  # Write permissions to be able to comment on PRs.
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  GOCACHE: /home/runner/work/go/pkg/build
  GOPATH: /home/runner/work/go
  GOBIN: /home/runner/work/go/bin
  GO111MODULE: on
  GO_VERSION: 1.24.6
  BENCHMARK_COUNT: 6
  PERFORMANCE_REGRESSION_THRESHOLD: 10
  PERFORMANCE_IMPROVEMENT_THRESHOLD: 30

jobs:
  benchmark:
    name: Run Benchmarks and Compare
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: git checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clean up runner space
        uses: ./.github/actions/cleanup-space

      - name: setup go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: '${{ env.GO_VERSION }}'

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Run benchmarks on base branch (${{ github.base_ref }})
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then
            BASE_REF="CI-benchmarks"
          fi

          echo "Running benchmarks on base branch: $BASE_REF"
          git fetch origin $BASE_REF
          git checkout origin/$BASE_REF

          go test -count=${{ env.BENCHMARK_COUNT }} -tags='dev error' -timeout=0 -benchmem -bench='^BenchmarkBroadcastAPI' -run=NONE ./wallet \
            2>&1 | tee base-bench-raw.txt

          grep '^Benchmark' base-bench-raw.txt | sort > base-bench.txt

      - name: Run benchmarks on PR branch (${{ github.head_ref }})
        run: |
          HEAD_REF="${{ github.head_ref }}"
          # Default to current branch for local testing
          if [ -z "$HEAD_REF" ]; then
            HEAD_REF=$(git rev-parse --abbrev-ref HEAD)
          fi

          echo "Running benchmarks on PR branch: $HEAD_REF"
          git fetch origin $HEAD_REF
          git checkout origin/$HEAD_REF

          go test -count=${{ env.BENCHMARK_COUNT }} -tags='dev error' -timeout=0 -benchmem -bench='^BenchmarkBroadcastAPI' -run=NONE ./wallet \
            2>&1 | tee pr-bench-raw.txt

          grep '^Benchmark' pr-bench-raw.txt | sort > pr-bench.txt

      - name: Compare benchmarks and check for performance regressions
        run: |
          chmod +x scripts/compare-benchmarks.sh
          # compare-benchmarks.sh <base> <pr> <output> <regression_threshold> <improvement_threshold>
          # Script exits with code 1 if regressions beyond threshold are detected
          scripts/compare-benchmarks.sh base-bench.txt pr-bench.txt summary.txt ${{ env.PERFORMANCE_REGRESSION_THRESHOLD }} ${{ env.PERFORMANCE_IMPROVEMENT_THRESHOLD }}

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const postComment = require('./scripts/post-benchmark-comment.js');
            await postComment(github, context);

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            summary.txt
            base-bench.txt
            pr-bench.txt
          retention-days: 30
